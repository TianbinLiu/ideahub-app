android.useAndroidX=true

org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-21.0.12.8-hotspot

# ★ 为 QQ 登录开的（android/app/libs/open_sdk_3.5.19*.jar）。
#
# QQ 的 SDK 里每个登录方法都有一组 Fragment 重载，指向**老 support 库**的
# android.support.v4.app.Fragment。我们一个都不调（只用 Activity 那几个重载），
# 但 javac 做重载决议时必须能加载所有同参数个数候选的参数类型 —— 加载不到就是
#   error: cannot access Fragment / class file for android.support.v4.app.Fragment not found
# 编译直接失败，跟"调没调"无关。
#
# jetifier 把这个 jar 里的 support 引用改写成 androidx，重载于是指向项目里真实存在的
# androidx.fragment.app.Fragment，编译通过，运行期也不会有两套 Fragment。
# 代价是构建时多一道字节码改写（实测增量构建仍是几秒级）。
#
# ⚠ 这个开关在 AGP 8 里已标记废弃。哪天它被移除，替代方案是给编译期补一个
#   android.support.v4.app.Fragment 的空壳类（只为让重载决议过得去，不进包）。
android.enableJetifier=true
