<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="900" height="560" fill="#0d1220"/>
  <text x="40" y="50" fill="#e8e2d0" font-size="26" font-weight="bold">女巫帽 · 歪戴角度标注 v2（松垮遮单眼）</text>

  <!-- 头部基准 -->
  <g transform="translate(280,300)">
    <circle cx="0" cy="0" r="90" fill="#F4E9DA" stroke="#5a6078" stroke-width="2"/>
    <line x1="0" y1="-160" x2="0" y2="120" stroke="#5a6078" stroke-width="1.5" stroke-dasharray="6 6"/>
    <text x="8" y="115" fill="#5a6078" font-size="13">头部中轴</text>

    <!-- 帽（倾斜 35°，松垮压向角色右眼） -->
    <g transform="rotate(-35)">
      <ellipse cx="0" cy="-84" rx="150" ry="34" fill="#123C2A" stroke="#D6B26A" stroke-width="3"/>
      <path d="M -62,-92 Q -30,-240 34,-268 Q 26,-190 52,-108 Z" fill="#123C2A" stroke="#D6B26A" stroke-width="3"/>
      <rect x="-58" y="-112" width="116" height="22" fill="#6E4F35"/>
      <rect x="18" y="-114" width="26" height="26" fill="#D6B26A" rx="3"/>
    </g>
    <line x1="0" y1="-84" x2="0" y2="-250" stroke="#67E8F9" stroke-width="1.5" stroke-dasharray="4 5"/>
    <line x1="0" y1="-84" x2="-62" y2="-236" stroke="#f2c14e" stroke-width="1.5" stroke-dasharray="4 5"/>
    <path d="M 0,-170 A 86,86 0 0 0 -49,-152" fill="none" stroke="#f2c14e" stroke-width="2.5"/>
    <text x="-74" y="-182" fill="#f2c14e" font-size="18" font-weight="bold">35°</text>
    <!-- 露出的左眼 + 泪痣；右眼被帽檐遮住 -->
    <circle cx="-34" cy="-16" r="9" fill="#3FA47C"/>
    <circle cx="-42" cy="8" r="3.2" fill="#6E4F35"/>
    <text x="-150" y="34" fill="#c9cede" font-size="13">露出眼（眼下泪痣）</text>
  </g>

  <!-- 规格说明 -->
  <g font-size="15" fill="#c9cede">
    <text x="520" y="130">① 帽体倾 35°，整体松垮（布料塌陷褶皱，非挺括）</text>
    <text x="520" y="165">② 帽檐垂压【遮住整只右眼】——右眼无痣，被遮</text>
    <text x="520" y="200">③ 露出的左眼：翡翠瞳 #3FA47C，眼下泪痣 ×1</text>
    <text x="520" y="235">④ 帽尖大幅下折垂坠（可挂星形小坠）</text>
    <text x="520" y="270">⑤ 帽带皮革棕 #6E4F35 + 黄铜方扣/绿宝石徽 #D6B26A</text>
    <text x="520" y="305">⑥ 帽檐直径 ≈ 肩宽 × 1.35（大一号才有松垮感）</text>
  </g>
  <text x="520" y="360" fill="#8a90a6" font-size="13">VRoid：帽子配饰网格绕 Z 轴 -35° + X 轴 +10°，右半帽檐顶点下拉变形</text>
  <text x="520" y="382" fill="#8a90a6" font-size="13">盖过右眼；痣在【左眼下】用面部贴图画（Face 纹理编辑层）。</text>
</svg>
