<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="900" height="720" fill="#0d1220"/>
  <text x="40" y="50" fill="#e8e2d0" font-size="26" font-weight="bold">铸卡师 · 7.5 头身比例尺 v1</text>

  <!-- 比例尺（每头 76px，总 570px） -->
  <g transform="translate(200,90)">
    <!-- 刻度 -->
    <g stroke="#5a6078" stroke-width="1.5">
      <line x1="-90" y1="0" x2="-60" y2="0"/><line x1="-90" y1="76" x2="-60" y2="76"/>
      <line x1="-90" y1="152" x2="-60" y2="152"/><line x1="-90" y1="228" x2="-60" y2="228"/>
      <line x1="-90" y1="304" x2="-60" y2="304"/><line x1="-90" y1="380" x2="-60" y2="380"/>
      <line x1="-90" y1="456" x2="-60" y2="456"/><line x1="-90" y1="532" x2="-60" y2="532"/>
      <line x1="-90" y1="570" x2="-60" y2="570"/>
      <line x1="-75" y1="0" x2="-75" y2="570"/>
    </g>
    <g fill="#8a90a6" font-size="13">
      <text x="-130" y="42">1 头</text><text x="-130" y="118">2</text><text x="-130" y="194">3</text>
      <text x="-130" y="270">4</text><text x="-130" y="346">5</text><text x="-130" y="422">6</text>
      <text x="-130" y="498">7</text><text x="-136" y="556">7.5</text>
    </g>

    <!-- 人体剪影 -->
    <ellipse cx="60" cy="38" rx="34" ry="38" fill="#3a4260"/>
    <path d="M 60,76 L 60,88 Q 24,100 20,150 Q 16,205 34,236 L 34,300 Q 30,380 40,455 L 44,532 L 34,570 L 58,570 L 62,470 L 66,470 L 70,570 L 94,570 L 84,532 L 88,455 Q 98,380 94,300 L 94,236 Q 112,205 108,150 Q 104,100 68,88 Z" fill="#3a4260"/>
    <!-- 手臂 -->
    <path d="M 22,120 Q 0,180 6,250 L 22,248 Q 22,190 34,150 Z" fill="#333a56"/>
    <path d="M 106,120 Q 128,180 122,250 L 106,248 Q 106,190 94,150 Z" fill="#333a56"/>

    <!-- 关键线标注 -->
    <g stroke="#67E8F9" stroke-width="1.2" stroke-dasharray="5 5">
      <line x1="-40" y1="76"  x2="150" y2="76"/>
      <line x1="-40" y1="152" x2="150" y2="152"/>
      <line x1="-40" y1="228" x2="150" y2="228"/>
      <line x1="-40" y1="304" x2="150" y2="304"/>
      <line x1="-40" y1="570" x2="150" y2="570"/>
    </g>
    <g fill="#c9cede" font-size="14">
      <text x="160" y="80">下巴（1 头）</text>
      <text x="160" y="128">肩线 ≈ 1.35 头 · 肩宽 ≈ 1.5 头宽（窄肩）</text>
      <text x="160" y="156">胸线（2 头）· 菱形开窗中心在 1.8 头</text>
      <text x="160" y="232">腰线（3 头）· 束腰 ≈ 0.95 头宽</text>
      <text x="160" y="308">臀线/裙摆起点（4 头）</text>
      <text x="160" y="440">裙摆至 6.2 头，靴口 6.8 头</text>
      <text x="160" y="574">脚底（7.5 头 · 总身高 ≈ 165cm 设定）</text>
    </g>
  </g>

  <text x="40" y="700" fill="#8a90a6" font-size="13">VRoid：身高滑条 165 / 头身比拉向成人；肩宽 -1 档（窄肩），腰 -2 档，手臂纤细 +1 档。</text>
</svg>
