# PR 门禁：只做一件事——`npm run build`（= `tsc && vite build`）必须通过。
#
# 为什么加：这个仓库在 PR #1 之前没有任何 CI，能不能合进 main 全靠人记得在本地跑一遍
# 构建。漏跑一次就可能把编译不过的代码带进 main，而 main 是出 APK 的分支。
#
# 为什么只跑 build 不跑测试：仓库目前没有测试套件，编不编得过是唯一能自动判定的事。
# `tsc` 那一半价值最大——类型错误是这个仓库最常见的、也是本地最容易漏跑的失败。
name: build

on:
  pull_request:
    branches: [main]
  # 直推 main 的历史提交也跑一遍：这个仓库以前是直接往 main 推的，
  # 不是所有改动都会走 PR
  push:
    branches: [main]

# 同一分支连续 push 时取消上一轮，别让队列越积越长
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # ★ 钉到 .nvmrc 里那个小版本（2026-10-15 教材人格评审，humble-delivery-8）：原来只钉大版本、拿 24.x 最新 ——
          #   而 build 串里十几道 check-*.mjs 靠的是 Node 把 .ts 的类型剥掉直接 import 跑，小版本一变、剥类型的行为
          #   可能变，CI 与开发机就不是同一台「机器」。版本只有 .nvmrc 一处（package.json 的 engines 跟着它）。
          node-version-file: .nvmrc
          cache: npm

      # 用 ci 而不是 install：严格按 package-lock.json 装，锁文件与 package.json
      # 对不上时直接失败，而不是悄悄改锁文件
      - run: npm ci

      # ★ 构建不需要 .env.local，也不需要 public/models/protected/——两者都被
      #   gitignore 挡着，CI 上根本不存在，这是**有意为之**：
      #   · 缺 ARK_API_KEY 只会让 __AI_REAL__ 变成 false（AI 走 mock），不影响编译；
      #   · protected/ 下的加密模型是运行时资产，不进 Vite 模块图。
      #   已实测：把 .env.local 挪开后 `npm run build` 照样退出 0。
      #   所以这里不要为了"让 CI 更真实"去塞任何密钥——它对构建结果没有影响。
      - run: npm run build
      # 构建里那步 lingui extract 若改了目录 = 代码里的文案与入仓的 .po 对不上（出包会冒中文）：当场红
      - run: git diff --exit-code src/locales

      # 源码里的版本号，到底发出去了没有。
      #
      # ★ 为什么这也值得占 CI 一格：**改 versionCode 和"发一版"是两件事**，
      #   而漏掉后者没有任何症状——本地装的是新的，这个 workflow 是绿的，
      #   仓库看着也正常；唯一的受害者是所有已经装了 App 的人，他们的「检查更新」
      #   一直查不到新版，而那个失败是静默的。
      #   真事（2026-08）：1.8 与 1.9 只提交了版本号、从未发布，直到有人问
      #   "官网下载页怎么还是 1.7"才发现，那时线上已经落后三版。
      #
      # ★ 只提醒不阻断（脚本永远 exit 0）：源码领先线上是开发期的正常状态，
      #   阻断的话每个 PR 都红，人会立刻学会无视它——那这道闸门就白写了。
      - name: 这个版本号发布了没（只提醒，不阻断）
        run: node scripts/check-published-version.mjs

  # 原生那一半的编译门禁（2026-10-15 教材人格评审，humble-delivery-3）。
  # ★ 为什么加：2026-09-01 以来 19 条提交动了 android/**/java，而上面那个 job 只编译 web 一半 —— Java 编译错要到发版那天
  #   `gradlew assembleSideloadRelease` 才第一次暴露。这个 job 先**不设为 required**（仓库 ruleset 不改）、跑两周看时长：
  #   gradle 冷启动 5~10 分钟，设成必过会把 `npm run land` 等 CI 的时间从约 90 秒拉到十分钟，是工作流节奏的取舍，要主人定。
  # ★ 只跑 `npx vite build`（不跑那 20 道 check，上面的 job 已经跑过）+ `cap sync` + debug 变体：debug 不要 keystore；
  #   `build:app` 的出包闸要 .env.local 与受保护模型，CI 上没有、也不该有（见上面那条 ★）。编出来的包不发给任何人。
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # ★ 21 不是 17：android/gradle.properties 把 org.gradle.java.home 钉在本机的 JDK 21 上（出包机就是它），CI 用同一个大版本，
          #   编出来的字节码与发版那台机器才是同一回事
          java-version: "21"
          cache: gradle
      - run: npm ci
      - run: npx vite build
      - run: npx cap sync android
      # ★ -Dorg.gradle.java.home 盖掉 gradle.properties 里那条 Windows 路径（第一次跑就栽在这儿：Linux 上那个路径不存在，gradle 当场拒）；
      #   命令行的 -D 系统属性优先级高于项目 gradle.properties，不用改那份文件
      - run: chmod +x gradlew && ./gradlew assembleSideloadDebug --no-daemon "-Dorg.gradle.java.home=$JAVA_HOME"
        working-directory: android
